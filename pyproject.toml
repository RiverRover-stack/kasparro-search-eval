[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kasparro-visibility-backend"
version = "0.1.0"
description = "Evidence-linked AI visibility analysis backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["backend*"]

